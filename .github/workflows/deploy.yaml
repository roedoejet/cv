name: Deploy site
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --frozen --no-dev
      - name: Freeze site
        run: uv run fab freeze
      - name: Verify output
        run: |
          test -f docs/index.html          || (echo "MISSING docs/index.html" && exit 1)
          test -f docs/projects/index.html || (echo "MISSING docs/projects/index.html" && exit 1)
          echo "Both pages generated successfully."
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
