  - title: Mother Tongues
    links:
      web: https://mothertongues.org
    description: Mother Tongues is an organization the releases open-source software for language revitalization. Most notable is Mother Tongues Dictionaries (MTD). MTD is the only dictionary app that is free and open-source, can be used for any language, has customizable approximate search, and is available for the Web, Android & iOS.
